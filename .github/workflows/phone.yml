name: Build phone apps

on:
  push:
    branches: [ios-port, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # better-sqlite3 has no prebuild for this Node and isn't needed for tests
      # (the suite runs on node:sqlite) or for the iOS bundle.
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run build:mobile

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry FinanceDashboard.ipa Payload
          ls -lh FinanceDashboard.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceDashboard-ipa
          path: ${{ runner.temp }}/FinanceDashboard.ipa
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionCode is the commit count, which must keep growing
          # (Android only installs a build over an older one with a higher code).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run build:mobile

      - name: Sync Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The permanent release key signs main only. Other branches and pull
      # requests build unsigned and upload nothing: their versionCode can be
      # higher than main's next build, and a phone that installed one would then
      # refuse every real update. On main a missing key is an error, not a
      # silently uninstallable APK.
      - name: Restore signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; main must build a signed APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$(git rev-list --count HEAD)
          export VERSION_NAME=$(node -p "require('../package.json').version")
          echo "versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "$RUNNER_TEMP/FinanceDashboard.apk"
          ls -lh "$RUNNER_TEMP/FinanceDashboard.apk"

      - name: Verify signature
        if: env.ANDROID_KEYSTORE_FILE != ''
        # Prints only public certificate details (subject + digests).
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/FinanceDashboard.apk" 2>&1 | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "^Verifies" "$RUNNER_TEMP/apksigner.txt"
          grep -q "CN=Finance Dashboard" "$RUNNER_TEMP/apksigner.txt"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_FILE != ''
        with:
          name: FinanceDashboard-apk
          path: ${{ runner.temp }}/FinanceDashboard.apk
          if-no-files-found: error
