name: Build iOS IPA

on:
  push:
    branches: [ios-port, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # better-sqlite3 has no prebuild for this Node and isn't needed for tests
      # (the suite runs on node:sqlite) or for the iOS bundle.
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npx vite build --config vite.config.ios.ts

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry FinanceDashboard.ipa Payload
          ls -lh FinanceDashboard.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceDashboard-ipa
          path: ${{ runner.temp }}/FinanceDashboard.ipa
          if-no-files-found: error
